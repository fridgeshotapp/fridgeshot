<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background square -->
  <rect width="120" height="120" rx="26" fill="#2D6A4F"/>

  <!-- Fridge body -->
  <rect x="28" y="18" width="64" height="82" rx="10" fill="white" opacity="0.97"/>

  <!-- Freezer top section -->
  <rect x="28" y="18" width="64" height="28" rx="10" fill="white"/>
  <rect x="28" y="38" width="64" height="8" fill="#D8F3DC"/>

  <!-- Divider -->
  <rect x="28" y="45" width="64" height="3" fill="#2D6A4F" opacity="0.15"/>

  <!-- Freezer handle -->
  <rect x="50" y="26" width="6" height="14" rx="3" fill="#40916C" opacity="0.6"/>

  <!-- Fridge handle -->
  <rect x="50" y="56" width="6" height="20" rx="3" fill="#40916C" opacity="0.6"/>

  <!-- Camera lens badge (bottom right) -->
  <circle cx="82" cy="88" r="18" fill="#E76F51"/>
  <circle cx="82" cy="88" r="11" fill="white" opacity="0.25"/>
  <circle cx="82" cy="88" r="6" fill="white" opacity="0.85"/>
  <!-- Highlight -->
  <circle cx="77.5" cy="83.5" r="2.5" fill="white"/>
</svg>
