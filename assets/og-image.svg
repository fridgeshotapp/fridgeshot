<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#13151E"/>
      <stop offset="100%" stop-color="#0A0C10"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#00C896" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00C896" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileBg" x1="0" y1="0" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1D27"/>
      <stop offset="100%" stop-color="#0A0C10"/>
    </linearGradient>
    <linearGradient id="fridge" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5F7FA"/>
      <stop offset="100%" stop-color="#DDE3E8"/>
    </linearGradient>
    <radialGradient id="lens" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </radialGradient>
    <filter id="tshadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#ogbg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- icon tile -->
  <g transform="translate(90 205)">
    <rect width="220" height="220" rx="50" fill="url(#tileBg)" filter="url(#tshadow)"/>
    <!-- fridge body -->
    <g transform="translate(48 30)">
      <rect width="115" height="160" rx="22" fill="url(#fridge)"/>
      <rect width="115" height="56" rx="22" fill="#F5F7FA"/>
      <rect y="40" width="115" height="17" fill="#DDE3E8"/>
      <rect y="55" width="115" height="4" fill="#00C896" opacity="0.22"/>
      <rect x="64" y="12" width="9" height="26" rx="4.5" fill="#00C896"/>
      <rect x="64" y="76" width="9" height="38" rx="4.5" fill="#00C896"/>
      <ellipse cx="25" cy="90" rx="9" ry="12" fill="#00C896" opacity="0.6"/>
      <rect x="40" y="83" width="15" height="18" rx="5" fill="#F97316" opacity="0.55"/>
      <rect x="20" y="120" width="26" height="10" rx="4" fill="#F97316" opacity="0.4"/>
    </g>
    <!-- camera badge -->
    <g transform="translate(140 148)">
      <circle r="42" fill="#000" opacity="0.35"/>
      <circle cx="-4" cy="-4" r="42" fill="url(#lens)"/>
      <circle cx="-4" cy="-4" r="42" fill="none" stroke="white" stroke-width="3" opacity="0.25"/>
      <circle cx="-4" cy="-4" r="28" fill="#9A3412" opacity="0.3"/>
      <circle cx="-4" cy="-4" r="16" fill="white" opacity="0.12"/>
      <circle cx="-4" cy="-4" r="10" fill="white" opacity="0.78"/>
      <ellipse cx="-14" cy="-14" rx="7" ry="5" fill="white" opacity="0.9"/>
    </g>
  </g>

  <!-- Text block -->
  <g font-family="Plus Jakarta Sans, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="380" y="290" fill="#F0F2F5" font-weight="800" font-size="96" letter-spacing="-2">FridgeShot</text>
    <text x="380" y="360" fill="#8B949E" font-weight="500" font-size="34">Foto a tu nevera <tspan fill="#00C896" font-weight="700">→</tspan> 3 recetas al instante con IA</text>
    <g transform="translate(380 420)" font-weight="600" font-size="22">
      <g>
        <circle cx="10" cy="-7" r="4" fill="#00C896"/>
        <text x="24" y="0" fill="#00C896">Sin registro</text>
      </g>
      <g transform="translate(180 0)">
        <circle cx="10" cy="-7" r="4" fill="#00C896"/>
        <text x="24" y="0" fill="#00C896">Gratis</text>
      </g>
      <g transform="translate(300 0)">
        <circle cx="10" cy="-7" r="4" fill="#00C896"/>
        <text x="24" y="0" fill="#00C896">En segundos</text>
      </g>
    </g>
    <text x="380" y="500" fill="#F97316" font-weight="800" font-size="26" letter-spacing="1">fridgeshot.app</text>
  </g>
</svg>
