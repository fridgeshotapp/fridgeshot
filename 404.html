<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada — FridgeShot</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: #0F1117;
      color: #F0F2F5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .icon { font-size: 72px; margin-bottom: 24px; }
    h1 { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
    p { font-size: 16px; color: #8B949E; margin-bottom: 32px; max-width: 360px; }
    .btn {
      background: #00C896; color: #0A0C10;
      border: none; border-radius: 14px;
      padding: 14px 28px; font-size: 15px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      text-decoration: none; display: inline-block;
      transition: transform 0.15s;
    }
    .btn:hover { transform: translateY(-2px); }
    .secondary {
      display: block; margin-top: 14px;
      font-size: 14px; color: #8B949E;
      text-decoration: underline;
    }
    .secondary:hover { color: #00C896; }
  </style>
</head>
<body>
  <div class="icon">🧊</div>
  <h1>Esta página no existe</h1>
  <p>Parece que la URL no es correcta. Vuelve al inicio o abre la app.</p>
  <a href="/" class="btn">Ir al inicio</a>
  <a href="/app" class="secondary">Abrir la app →</a>
</body>
</html>
